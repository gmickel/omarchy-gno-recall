name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check panel focus release
        run: node scripts/test-panel-focus.mjs
      - name: Check runtime trust boundary
        run: python3 scripts/test-runtime.py
      - name: Check runtime failure UI
        run: node scripts/test-service-runtime.mjs
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Install and smoke-test pinned runtime
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/gno-recall-runtime
        run: |
          ./scripts/install-runtime.sh
          python3 scripts/smoke-runtime.py
      - name: Validate marketplace submission layout and entry points
        run: |
          python3 scripts/test-marketplace-layout.py
          plugin_export=$(mktemp -d)
          git archive HEAD | tar -x -C "$plugin_export"
          python3 scripts/test-marketplace-layout.py --export "$plugin_export"
